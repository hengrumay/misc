# =============================================================================
# BUILD ARTIFACT — vendored from root demo.config.yaml by app/build.py.
# Placeholders only; NEVER commit real workspace/warehouse/catalog values here.
# =============================================================================

initiative: rwe-ads-automation
persona: MD Epi-RWDS

workspace:
  host: "<your-workspace>.cloud.databricks.com"   # your workspace host (auth is profile-based; also set a CLI profile)
  warehouse_id: "<your-warehouse-id>"     # serverless SQL warehouse (e.g. "Serverless Starter Warehouse")
  compute: serverless                       # ENFORCED everywhere — no all-purpose/classic clusters

catalog: <your-catalog>            # catalog MUST already exist — never CREATE CATALOG

schemas:
  raw: ads_raw            # bronze: synthetic RWD landing + parsed protocols
  curated: ads_curated    # silver: conformed RWD common data model
  serving: ads_serving    # gold: analytic base tables + generated ADS outputs
  kb: ads_kb              # approved-SQL KB, prompts, eval datasets, PoC fixtures
  audit: ads_audit        # reproducibility manifests + GxP audit + e-signature

volumes:
  protocols: ads_raw.protocols            # uploaded study protocol PDFs/DOCX

# Lakebase = Autoscaling (Provisioned tier is retired). Prereq (like "catalog must
# pre-exist"): `databricks postgres create-project <project>` — this auto-creates the
# `production` branch, `primary` read-write endpoint, and `databricks_postgres` DB, so
# the app's `postgres` resource binds a DB that exists at `bundle deploy` (no 404).
lakebase:
  project: rwe-ads-lakebase                   # Autoscaling project id (rename with your initials, e.g. <initials>-rwe-ads-lakebase) — run create-project on this first
  branch: production                      # auto-created production branch
  endpoint: primary                       # auto-created primary read-write endpoint
  bound_database: databricks_postgres     # auto-created DB the app resource binds (exists at project create)
  pg_version: 17                          # Autoscaling default (charter target 17.x)
  database: ads_serving_pg                # low-latency serving DB (created in wave0, synced from gold)
  app_state_db: ads_app                   # app sessions, review queue, sign-offs (created in wave0)
  # DEFAULT SERVING PATH NEEDS NO NEW UC CATALOG AND NO CREATE_CATALOG.
  # create-synced-table writes gold into Lakebase Postgres under an EXISTING owned
  # catalog (`catalog`, above) + `synced_uc_schema`; the app reads that Postgres
  # DIRECTLY (app/backend/app.py -> public.<table>). `catalog` below is OPTIONAL —
  # used ONLY by the opt-in create-catalog step (setup_lakebase.sh with
  # LAKEBASE_REGISTER_UC_CATALOG=1), which alone requires CREATE_CATALOG.
  catalog: ads_lakebase                   # OPTIONAL UC catalog over the serving DB — used only by the opt-in create-catalog step (requires CREATE_CATALOG). Not needed for serving or the app.
  storage_catalog: <your-catalog> # regular UC catalog for the synced-table DLT pipeline metadata (NOT a Lakebase catalog)
  synced_uc_schema: public                # UC schema (in the data `catalog`) hosting the synced-table online views; its name is ALSO the Postgres schema the app reads (app/backend/app.py -> public.ads_output). Keep "public".
  synced_tables:                          # Delta -> Lakebase Postgres one-way (pk required for create-synced-table)
    - {source: ads_serving.ads_output, target: ads_output, pk: row_id}       # multi-study: row_id = study_id_patient_id
    - {source: ads_serving.cohort_summary, target: cohort_summary, pk: study_id}

synthetic_rwd:
  n_patients: 50000
  date_range: {start: "2018-01-01", end: "2024-12-31"}
  entities: [patient, enrollment_span, medical_claim, pharmacy_claim, provider, lab_result, encounter]
  code_systems: {dx: ICD-10-CM, proc: [CPT, HCPCS], rx: NDC, lab: LOINC}
  seed: 20260812                          # deterministic generation for reproducibility

gateway:
  endpoint: ads-ai-gateway
  guardrails: {pii: mask, phi_aware: true, safety: on, prompt_injection: on, jailbreak: on}
  egress_policy: deny_external            # Contextual Service Policy: no external tool egress
  rate_limit_qpm: 300
  cost_attribution_tag: {initiative: rwe-ads-automation, team: epi-rwds}
  spend_cap_usd_month: 2000               # hard cap
  inference_table: ads_audit.gateway_inference

models:
  candidates:                             # modern cross-vendor set (pay-per-token Foundation Models)
    - databricks-claude-sonnet-5
    - databricks-gpt-5-5
    - databricks-gemini-3-7-flash
  default: databricks-claude-sonnet-5
  embedding: databricks-gte-large-en

# Reference-free extraction eval (Stages 1-3) that gates protocol approval.
# Stage 1 (deterministic) is the hard gate and needs no model. Stage 3 judges are
# reference-free (no SME labels); model calls run in-process with PII masking + audit logging (gateway_call), not through the named ads-ai-gateway endpoint.
extraction_eval:
  enable_judge: true                      # Stage-3 model judges; false = Stage-1/2 only (gate still works)
  judge_model: databricks-claude-sonnet-5 # reference-free judge; falls back to models.default if unset
  confidence_floor: 0.5                    # Stage-2: per-field confidence below this is flagged for review
  max_doc_chars: 20000                     # cap on source text sent to the judge (matches ai_extract precision cap)
  priority_weights:                        # review-queue ranking (higher = worse = reviewed first)
    hard_fail: 10.0
    type_flag: 5.0
    incomplete: 3.0
    low_confidence: 2.0

approved_sql_kb:
  table: ads_kb.approved_sql_kb           # governed, versioned SQL snippet library
  index: ads_serving.approved_sql_index   # Vector Search over snippet descriptions
  vs_endpoint: ads-vs-endpoint

# Vector Search over the approved-SQL KB descriptions. Optional; off by default.
# When enabled, build_index builds a TRIGGERED delta-sync index (embeddings via
# models.embedding) and kb_retrieval queries it; otherwise KB retrieval keyword-matches.
vector_search:
  enabled: false                          # optional — flip true + a creatable/pre-existing endpoint to activate; keyword match is the default


poc_studies:                              # PoCs spanning complexity per charter
  - {id: poc_low, title: "Simple prevalence cohort", complexity: low}
  - {id: poc_med, title: "Drug-exposure new-user cohort w/ covariates", complexity: medium}
  - {id: poc_high, title: "Comparative outcomes w/ time-varying exposure", complexity: high}

app:
  name: rwe-ads-app                       # rename with your initials, e.g. <initials>-rwe-ads-app (apps are NOT dev-prefixed — must be unique)

# Genie Agent (analyst Q&A) — PLACEHOLDER, not yet built. The one place an agent
# genuinely fits: read-only natural-language Q&A over the APPROVED ADS outputs
# (post review + e-sign). The build path stays deterministic. See CHANGELOG (Planned).
genie:
  enabled: false                          # placeholder — no Genie space created yet
  space_name: ads-analyst-qa              # intended Genie Agent (space) name
  tables:                                 # approved ADS outputs exposed for read-only Q&A
    - ads_serving.ads_output
    - ads_serving.cohort_summary

branding:
  databricks: {lava: "FF3621", navy: "1B3139"}

# DEMO ONLY — unattended auto-e-sign; MUST be false for any real/regulated deployment (human review in the app is the control)
allow_auto_esign: true

gxp:
  part11: true
  reproducibility_manifest: true
  audit_retention_years: 25
  esignature_required_events: [ads_approval, kb_snippet_approval, protocol_approval]
